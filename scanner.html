<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เครื่องสแกนพัสดุ</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { 
            --danger: #ff4d4f; --warning: #faad14; --success: #52c41a; --primary: #1890ff; 
            --bg-modal: #ffffff; --bg-item: #f9f9f9;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        
        #reader { width: 100vw; height: 100vh; }

        /* Top Bar */
        .scanner-header {
            position: fixed; top: 0; left: 0; width: 100%; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
        }
        
        #scan-status-box { 
            background: rgba(255,255,255,0.95); padding: 8px 18px; 
            border-radius: 25px; font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); color: #333;
        }

        .btn-exit { 
            background: var(--danger); color: white; border: none; 
            padding: 8px 16px; border-radius: 12px; font-weight: bold; font-size: 13px;
        }

        /* Bottom Bar */
        .scanner-footer {
            position: fixed; bottom: 35px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 10;
        }

        .btn-summary { 
            background: rgba(255,255,255,0.25); color: white; border: 1px solid rgba(255,255,255,0.4);
            padding: 14px 35px; border-radius: 35px; font-weight: bold; font-size: 16px;
            backdrop-filter: blur(15px); box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: 0.2s;
        }

        /* Modal Summary */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: flex-end; 
            backdrop-filter: blur(10px); 
        }
        .modal-content { 
            background: var(--bg-modal); width: 100%; max-width: 500px; height: 85vh; 
            border-radius: 30px 30px 0 0; padding: 25px; display: flex; flex-direction: column; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* Progress Bar */
        .progress-container { width: 100%; background: #eee; height: 8px; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        #progress-bar { height: 100%; background: var(--success); width: 0%; transition: 0.5s; }

        /* Summary Cards */
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .sum-card { padding: 12px 5px; border-radius: 18px; text-align: center; border: 1px solid transparent; }
        .sum-card b { font-size: 20px; display: block; margin-bottom: 2px; }
        .sum-card span { font-size: 10px; font-weight: bold; text-transform: uppercase; opacity: 0.8; }
        
        .scanned { background: #f6ffed; border-color: #b7eb8f; color: #389e0d; }
        .remaining { background: #fffbe6; border-color: #ffe58f; color: #d48806; }
        .notrack { background: #fff1f0; border-color: #ffa39e; color: #cf1322; }

        /* Tabs (Pill Style) */
        .tab-container { 
            display: flex; background: #f0f0f0; padding: 4px; border-radius: 12px; 
            margin-bottom: 15px; gap: 4px;
        }
        .tab-btn { 
            flex: 1; padding: 10px; border: none; background: none; 
            font-size: 12px; font-weight: bold; color: #888; border-radius: 10px;
            cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        /* List Items */
        #summary-list-area { overflow-y: auto; flex-grow: 1; padding-right: 5px; }
        .list-item { 
            background: #fff; padding: 14px; border-radius: 15px; margin-bottom: 10px;
            border: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .list-item b { font-size: 14px; color: #333; letter-spacing: 0.5px; }
        .plt-tag { font-size: 9px; padding: 3px 8px; border-radius: 6px; color: white; margin-right: 8px; font-weight: 800; }

        /* Duplicate/Error Alert */
        .dup-box { background: #fff; padding: 35px 25px; border-radius: 30px; text-align: center; width: 80%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="scanner-header">
        <div id="scan-status-box">🔄 กำลังโหลดข้อมูล...</div>
        <button class="btn-exit" onclick="location.href='orders.html'">ปิด X</button>
    </div>

    <div class="scanner-footer">
        <button class="btn-summary" onclick="toggleSummary(true)">📋 ดูสรุปและรายการ</button>
    </div>

    <div id="reader"></div>

    <div id="summary-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 style="margin:0; font-size: 18px; color:#333;">สรุปคำสั่งซื้อ</h3>
                    <small id="sum-shipping-name" style="color:var(--primary); font-weight:bold;"></small>
                </div>
                <button onclick="toggleSummary(false)" style="background:#eee; border:none; width:35px; height:35px; border-radius:50%; font-weight:bold; color:#666;">✕</button>
            </div>

            <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:12px; font-weight:bold;">
                <span>ความสำเร็จ</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="progress-container"><div id="progress-bar"></div></div>
            
            <div class="summary-grid">
                <div class="sum-card scanned"><b id="sum-scanned">0</b><span>แสกนแล้ว</span></div>
                <div class="sum-card remaining"><b id="sum-remaining">0</b><span>ยังไม่แสกน</span></div>
                <div class="sum-card notrack"><b id="sum-notrack">0</b><span>ไม่มีเลข</span></div>
            </div>
    
            <div class="tab-container">
                <button id="tab-remain" class="tab-btn active" onclick="showList('REMAIN')">ยังค้าง</button>
                <button id="tab-notrack" class="tab-btn" onclick="showList('NOTRACK')">ไม่มีเลข</button>
                <button id="tab-done" class="tab-btn" onclick="showList('DONE')">สำเร็จ</button>
            </div>
    
            <div id="summary-list-area"></div>
        </div>
    </div>

    <div id="dup-modal" class="modal" style="align-items: center; background: rgba(0,0,0,0.9);">
        <div class="dup-box">
            <div id="alert-icon" style="font-size: 50px; margin-bottom: 15px;">⚠️</div>
            <h2 id="alert-title" style="margin:0 0 10px 0; color:#333;">พบปัญหา</h2>
            <p id="dup-text" style="font-size: 16px; color: #666; margin-bottom: 25px;"></p>
            <button onclick="closeDup()" style="width:100%; padding:15px; background:#333; color:white; border:none; border-radius:15px; font-weight:bold; font-size:16px;">ตกลง</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbximNNkb_3daJpWHs2Virt9jphxQi7JlpA6gSpyCgrPwd1TqHvXD-49cjgG8HBEdk93bQ/exec';
        const urlParams = new URLSearchParams(window.location.search);
        const selectedShipping = urlParams.get('shipping');
        
        let html5QrCode;
        let allOrdersData = []; 
        let scannedToday = new Set(); 
        let targetTracks = new Set(); 
        let isPaused = false;
        let currentTab = 'REMAIN';

        window.onload = () => {
            if (!selectedShipping) { alert("กรุณาเลือกขนส่งก่อน"); location.href='orders.html'; return; }
            document.getElementById('sum-shipping-name').innerText = selectedShipping;
            loadScannerData();
        };

        function loadScannerData() {
            fetch(`${SCRIPT_URL}?action=getScannerData&shipping=${encodeURIComponent(selectedShipping)}`)
                .then(r => r.json())
                .then(data => {
                    allOrdersData = data.orders || [];
                    scannedToday = new Set((data.scanned || []).map(t => t.toUpperCase()));
                    targetTracks = new Set();
                    allOrdersData.forEach(o => { if(o.tracking) targetTracks.add(o.tracking.toUpperCase()); });
                    updateCounter();
                    startCamera();
                })
                .catch(err => alert("โหลดข้อมูลล้มเหลว: " + err));
        }

        function updateCounter() {
            const scannedCount = allOrdersData.filter(o => o.tracking && scannedToday.has(o.tracking.toUpperCase())).length;
            const targetCount = targetTracks.size;
            const percent = targetCount > 0 ? Math.round((scannedCount / targetCount) * 100) : 0;
            
            document.getElementById('scan-status-box').innerText = `📊 ${selectedShipping}: ${scannedCount}/${targetCount}`;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '%';
        }

        function toggleSummary(show) {
            document.getElementById('summary-modal').style.display = show ? 'flex' : 'none';
            isPaused = show;
            if(show) renderSummary();
        }

        function renderSummary() {
            const scannedList = allOrdersData.filter(o => o.tracking && scannedToday.has(o.tracking.toUpperCase()));
            const remainingList = allOrdersData.filter(o => o.tracking && !scannedToday.has(o.tracking.toUpperCase()));
            const noTrackList = allOrdersData.filter(o => !o.tracking || o.tracking.trim() === "");

            document.getElementById('sum-scanned').innerText = scannedList.length;
            document.getElementById('sum-remaining').innerText = remainingList.length;
            document.getElementById('sum-notrack').innerText = noTrackList.length;
            document.getElementById('sum-total').innerText = allOrdersData.length;

            showList(currentTab);
        }

        function showList(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab.toLowerCase()).classList.add('active');

            const listArea = document.getElementById('summary-list-area');
            let list = [];

            if (tab === 'REMAIN') list = allOrdersData.filter(o => o.tracking && !scannedToday.has(o.tracking.toUpperCase()));
            if (tab === 'NOTRACK') list = allOrdersData.filter(o => !o.tracking || o.tracking.trim() === "");
            if (tab === 'DONE') list = allOrdersData.filter(o => o.tracking && scannedToday.has(o.tracking.toUpperCase()));

            if (list.length === 0) {
                listArea.innerHTML = '<div style="text-align:center; padding:50px 0;"><div style="font-size:40px; margin-bottom:10px;">☕</div><div style="color:#999; font-size:14px;">ไม่มีรายการในหมวดนี้</div></div>';
                return;
            }

            listArea.innerHTML = list.map(o => `
                <div class="list-item">
                    <div>
                        <span class="plt-tag" style="background:${o.platform === 'Tiktok' ? '#000' : '#ee4d2d'}">${o.platform}</span>
                        <b>${o.tracking || '---'}</b>
                    </div>
                    <div style="color:${tab === 'DONE' ? 'var(--success)' : '#999'}; font-size:11px; font-weight:bold;">${o.status}</div>
                </div>
            `).join('');
        }

        function onScanSuccess(decodedText) {
            if (isPaused) return;
            const code = String(decodedText).trim().toUpperCase();

            if (!targetTracks.has(code)) {
                handleError("ไม่พบเลขพัสดุนี้ในรายการ!", "#ff4d4f", "❌ ไม่พบข้อมูล", "⛔");
                return;
            }

            if (scannedToday.has(code)) {
                handleError("เลขพัสดุนี้ถูกสแกนบันทึกไปแล้ว", "#faad14", "⚠️ สแกนซ้ำ", "🔄");
                return;
            }

            isPaused = true;
            scannedToday.add(code);
            playBeep('success');
            
            document.getElementById('scan-status-box').innerText = "✅ บันทึกแล้ว: " + code;
            document.getElementById('scan-status-box').style.color = "var(--success)";
            
            fetch(`${SCRIPT_URL}?action=scan&tracking=${encodeURIComponent(code)}`, { mode: 'no-cors' });

            setTimeout(() => {
                isPaused = false;
                updateCounter();
            }, 1500);
        }

        function handleError(msg, bgColor, title, icon) {
            isPaused = true;
            playBeep('error');
            document.body.style.background = bgColor;
            document.getElementById('alert-icon').innerText = icon;
            document.getElementById('alert-title').innerText = title;
            document.getElementById('dup-text').innerText = msg;
            document.getElementById('dup-modal').style.display = 'flex';
        }

        function closeDup() {
            document.getElementById('dup-modal').style.display = 'none';
            document.body.style.background = "#000";
            setTimeout(() => isPaused = false, 500);
        }

        function startCamera() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, onScanSuccess);
        }

        function playBeep(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = type === 'success' ? 'sine' : 'sawtooth';
            osc.frequency.value = type === 'success' ? 800 : 200;
            osc.connect(ctx.destination);
            osc.start();
            setTimeout(() => osc.stop(), 200);
        }
    </script>
</body>
</html>
