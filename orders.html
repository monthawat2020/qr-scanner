<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>จัดการคำสั่งซื้อ</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f8f9fa; }
        
        /* ส่วนหัว */
        .header { background: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-back { text-decoration: none; font-size: 20px; color: #333; }
        
        /* Dashboard */
        .content { padding: 20px; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h4 { margin: 0; color: #666; font-size: 14px; }
        .card p { margin: 10px 0 0 0; font-size: 28px; font-weight: bold; color: var(--primary); }

        /* ปุ่มลอย FAB */
        .fab-scan { position: fixed; bottom: 30px; right: 20px; background: var(--success); color: white; border: none; width: 70px; height: 70px; border-radius: 50%; font-size: 30px; box-shadow: 0 6px 15px rgba(40,167,69,0.4); cursor: pointer; display: flex; justify-content: center; align-items: center; }

        /* Scanner Overlay */
        #scanner-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; }
        #reader { width: 100%; height: 100%; }
        .scan-ui { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; z-index: 110; }
        #scan-status { background: white; padding: 10px 20px; border-radius: 30px; font-weight: bold; }
        .btn-close { position: absolute; top: 20px; right: 20px; background: var(--danger); color: white; border: none; padding: 10px; border-radius: 5px; z-index: 110; }

        /* Popup ซ้ำ */
        #dup-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index: 200; justify-content:center; align-items:center; }
        .dup-box { background: #ffeb3b; padding: 30px; border-radius: 20px; text-align: center; width: 80%; border: 4px solid #ff9800; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="btn-back">⬅</a>
        <h2 style="margin:0;">จัดการคำสั่งซื้อ</h2>
    </div>

    <div class="content">
        <div class="dashboard">
            <div class="card">
                <h4>เป้าหมายวันนี้</h4>
                <p>--</p>
            </div>
            <div class="card">
                <h4>สแกนแล้ว</h4>
                <p id="stat-scanned">0</p>
            </div>
        </div>

        <h3>รายการสแกนล่าสุด</h3>
        <div id="recent-list" style="background:white; border-radius:10px; padding:10px;">
            <p style="text-align:center; color:#999;">กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <button class="fab-scan" onclick="openScanner()">📷</button>

    <div id="scanner-overlay">
        <button class="btn-close" onclick="closeScanner()">X ปิด</button>
        <div class="scan-ui"><div id="scan-status">พร้อมสแกน</div></div>
        <div id="reader"></div>
    </div>

    <div id="dup-modal">
        <div class="dup-box">
            <h2>⚠️ ข้อมูลซ้ำ!</h2>
            <p id="dup-text"></p>
            <button onclick="closeDup()" style="padding:10px 20px; border:none; background:#333; color:white; border-radius:10px;">ตกลง</button>
        </div>
    </div>

    <script>
        // ใช้ URL ของ Google Apps Script ของคุณ
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbximNNkb_3daJpWHs2Virt9jphxQi7JlpA6gSpyCgrPwd1TqHvXD-49cjgG8HBEdk93bQ/exec';
        let html5QrCode;
        let scannedCodes = new Set();
        let isPaused = false;

        window.onload = loadData;

        function loadData() {
            fetch(SCRIPT_URL + '?action=getToday')
                .then(r => r.json())
                .then(data => {
                    scannedCodes = new Set(data.map(c => String(c).trim().toUpperCase()));
                    updateUI();
                });
        }

        function updateUI() {
            document.getElementById('stat-scanned').innerText = scannedCodes.size;
            const list = document.getElementById('recent-list');
            if (scannedCodes.size > 0) {
                const arr = Array.from(scannedCodes).reverse().slice(0, 5);
                list.innerHTML = arr.map(c => `<div style="padding:10px; border-bottom:1px solid #eee;">✅ ${c}</div>`).join('');
            } else {
                list.innerHTML = '<p style="text-align:center; color:#999;">ยังไม่มีข้อมูลของวันนี้</p>';
            }
        }

        function openScanner() {
            document.getElementById('scanner-overlay').style.display = 'block';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess);
        }

        function closeScanner() {
            if(html5QrCode) html5QrCode.stop().then(() => { document.getElementById('scanner-overlay').style.display = 'none'; });
        }

        function onScanSuccess(decodedText) {
            if (isPaused) return;
            const code = String(decodedText).trim().toUpperCase();

            if (scannedCodes.has(code)) {
                isPaused = true;
                document.getElementById('dup-text').innerText = "เลขพัสดุ " + code + " ถูกสแกนไปแล้ว";
                document.getElementById('dup-modal').style.display = 'flex';
                return;
            }

            isPaused = true;
            scannedCodes.add(code);
            document.getElementById('scan-status').innerText = "✅ บันทึกแล้ว: " + code;
            
            fetch(SCRIPT_URL + '?tracking=' + encodeURIComponent(code));
            updateUI();

            setTimeout(() => { isPaused = false; document.getElementById('scan-status').innerText = "พร้อมสแกนต่อไป"; }, 1500);
        }

        function closeDup() { document.getElementById('dup-modal').style.display = 'none'; setTimeout(() => isPaused = false, 500); }
    </script>
</body>
</html>
