<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เครื่องสแกนพัสดุ</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { 
            --danger: #ff4d4f; --warning: #faad14; --success: #52c41a; --primary: #1890ff; 
            --bg-modal: #ffffff;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        #reader { width: 100vw; height: 100vh; }

        /* Interface Layout */
        .scanner-header {
            position: fixed; top: 0; left: 0; width: 100%; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
        }
        #scan-status-box { 
            background: rgba(255,255,255,0.95); padding: 8px 18px; 
            border-radius: 25px; font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); color: #333;
        }
        .btn-exit { background: var(--danger); color: white; border: none; padding: 8px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .scanner-footer { position: fixed; bottom: 35px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 10; }
        .btn-summary { 
            background: rgba(255,255,255,0.25); color: white; border: 1px solid rgba(255,255,255,0.4);
            padding: 14px 35px; border-radius: 35px; font-weight: bold; font-size: 16px;
            backdrop-filter: blur(15px); box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        /* Modal Styles */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: flex-end; 
            backdrop-filter: blur(10px); 
        }
        .modal-content { 
            background: var(--bg-modal); width: 100%; max-width: 500px; height: 85vh; 
            border-radius: 30px 30px 0 0; padding: 25px; display: flex; flex-direction: column; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3); animation: slideUp 0.3s ease-out; box-sizing: border-box;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Summary Dashboard */
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 15px 0; }
        .sum-card { padding: 12px 5px; border-radius: 18px; text-align: center; border: 1px solid #eee; }
        .sum-card b { font-size: 20px; display: block; }
        .sum-card span { font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .scanned { background: #f6ffed; color: #389e0d; }
        .remaining { background: #fffbe6; color: #d48806; }
        .notrack { background: #fff1f0; color: #cf1322; }

        /* Tabs & Lists */
        .tab-container { display: flex; background: #f0f0f0; padding: 4px; border-radius: 12px; margin-bottom: 15px; gap: 4px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: none; font-size: 12px; font-weight: bold; color: #888; border-radius: 10px; cursor: pointer; }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #summary-list-area { overflow-y: auto; flex-grow: 1; }
        .list-item { background: #fff; padding: 14px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .plt-tag { font-size: 9px; padding: 3px 8px; border-radius: 6px; color: white; margin-right: 8px; font-weight: 800; }

        /* Alert Box */
        .dup-box { background: #fff; padding: 30px; border-radius: 30px; text-align: center; width: 85%; max-width: 320px; }
    </style>
</head>
<body>

    <div class="scanner-header">
        <div id="scan-status-box">🔄 กำลังโหลดข้อมูล...</div>
        <button class="btn-exit" onclick="location.href='orders.html'">ปิด X</button>
    </div>

    <div class="scanner-footer">
        <button class="btn-summary" onclick="toggleSummary(true)">📋 ดูสรุปและรายการ</button>
    </div>

    <div id="reader"></div>

    <div id="summary-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 style="margin:0; font-size: 18px;">สรุปคำสั่งซื้อ</h3>
                    <small id="sum-shipping-name" style="color:var(--primary); font-weight:bold;"></small>
                </div>
                <button onclick="toggleSummary(false)" style="background:#eee; border:none; width:35px; height:35px; border-radius:50%; cursor:pointer;">✕</button>
            </div>

            <div class="summary-grid">
                <div class="sum-card scanned"><b id="sum-scanned">0</b><span>แสกนแล้ว</span></div>
                <div class="sum-card remaining"><b id="sum-remaining">0</b><span>ยังไม่แสกน</span></div>
                <div class="sum-card notrack"><b id="sum-notrack">0</b><span>ไม่มีเลข</span></div>
            </div>
    
            <div class="tab-container">
                <button id="tab-remain" class="tab-btn active" onclick="showList('REMAIN')">ยังค้าง</button>
                <button id="tab-notrack" class="tab-btn" onclick="showList('NOTRACK')">ไม่มีเลข</button>
                <button id="tab-done" class="tab-btn" onclick="showList('DONE')">สำเร็จ</button>
            </div>
    
            <div id="summary-list-area"></div>
        </div>
    </div>

    <div id="alert-modal" class="modal" style="align-items: center;">
        <div class="dup-box">
            <div id="alert-icon" style="font-size: 50px; margin-bottom: 10px;">⚠️</div>
            <h2 id="alert-title" style="margin:0; font-size: 20px;">พบปัญหา</h2>
            <p id="alert-text" style="color: #666; margin: 15px 0 25px 0;"></p>
            <button onclick="closeAlert()" style="width:100%; padding:15px; background:#333; color:white; border:none; border-radius:15px; font-weight:bold; font-size:16px; cursor:pointer;">ตกลง</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbximNNkb_3daJpWHs2Virt9jphxQi7JlpA6gSpyCgrPwd1TqHvXD-49cjgG8HBEdk93bQ/exec';
        const urlParams = new URLSearchParams(window.location.search);
        const selectedShipping = urlParams.get('shipping');
        
        let html5QrCode;
        let allOrdersData = []; 
        let scannedToday = new Set(); 
        let targetTracks = new Set(); 
        let isPaused = false;
        let currentTab = 'REMAIN';

        window.onload = () => {
            if (!selectedShipping) { alert("กรุณาเลือกขนส่งก่อน"); location.href='orders.html'; return; }
            document.getElementById('sum-shipping-name').innerText = selectedShipping;
            loadScannerData();
        };

        function loadScannerData() {
            fetch(`${SCRIPT_URL}?action=getScannerData&shipping=${encodeURIComponent(selectedShipping)}`)
                .then(r => r.json())
                .then(data => {
                    allOrdersData = data.orders || [];
                    scannedToday = new Set((data.scanned || []).map(t => t.toUpperCase()));
                    targetTracks = new Set();
                    allOrdersData.forEach(o => { if(o.tracking) targetTracks.add(o.tracking.toUpperCase()); });
                    updateCounter();
                    startCamera();
                });
        }

        function updateCounter() {
            const scannedCount = allOrdersData.filter(o => o.tracking && scannedToday.has(o.tracking.toUpperCase())).length;
            document.getElementById('scan-status-box').innerText = `📊 ${selectedShipping}: ${scannedCount}/${targetTracks.size}`;
        }

        function toggleSummary(show) {
            document.getElementById('summary-modal').style.display = show ? 'flex' : 'none';
            isPaused = show;
            if(show) renderSummary();
        }

        function renderSummary() {
            const scannedList = allOrdersData.filter(o => o.tracking && scannedToday.has(o.tracking.toUpperCase()));
            const remainingList = allOrdersData.filter(o => o.tracking && !scannedToday.has(o.tracking.toUpperCase()));
            const noTrackList = allOrdersData.filter(o => !o.tracking || o.tracking.trim() === "");

            // Safety Check: ป้องกัน Error ที่คุณเจอ
            const elScanned = document.getElementById('sum-scanned');
            const elRem = document.getElementById('sum-remaining');
            const elNoTrack = document.getElementById('sum-notrack');
            const elTotal = document.getElementById('sum-total');

            if (elScanned) elScanned.innerText = scannedList.length;
            if (elRem) elRem.innerText = remainingList.length;
            if (elNoTrack) elNoTrack.innerText = noTrackList.length;
            
            showList(currentTab);
        }

        function showList(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const activeTabBtn = document.getElementById('tab-' + tab.toLowerCase());
            if (activeTabBtn) activeTabBtn.classList.add('active');

            const listArea = document.getElementById('summary-list-area');
            let list = [];

            if (tab === 'REMAIN') list = allOrdersData.filter(o => o.tracking && !scannedToday.has(o.tracking.toUpperCase()));
            if (tab === 'NOTRACK') list = allOrdersData.filter(o => !o.tracking || o.tracking.trim() === "");
            if (tab === 'DONE') list = allOrdersData.filter(o => o.tracking && scannedToday.has(o.tracking.toUpperCase()));

            if (list.length === 0) {
                listArea.innerHTML = '<div style="text-align:center; padding:50px 0; color:#999;">ไม่มีรายการ</div>';
                return;
            }

            listArea.innerHTML = list.map(o => `
                <div class="list-item">
                    <div>
                        <span class="plt-tag" style="background:${o.platform === 'Tiktok' ? '#000' : '#ee4d2d'}">${o.platform}</span>
                        <b>${o.tracking || '---'}</b>
                    </div>
                    <div style="font-size:11px; font-weight:bold; color:#999;">${o.status}</div>
                </div>
            `).join('');
        }

        function onScanSuccess(decodedText) {
            if (isPaused) return;
            const code = String(decodedText).trim().toUpperCase();

            if (!targetTracks.has(code)) {
                showAlert("ไม่พบเลขพัสดุนี้ในรายการ!", "❌ ไม่พบข้อมูล", "⛔");
                return;
            }

            if (scannedToday.has(code)) {
                showAlert("เลขพัสดุนี้ถูกสแกนบันทึกไปแล้ว", "⚠️ สแกนซ้ำ", "🔄");
                return;
            }

            isPaused = true;
            scannedToday.add(code);
            playBeep('success');
            
            document.getElementById('scan-status-box').innerText = "✅ บันทึกแล้ว: " + code;
            fetch(`${SCRIPT_URL}?action=scan&tracking=${encodeURIComponent(code)}`, { mode: 'no-cors' });

            setTimeout(() => {
                isPaused = false;
                updateCounter();
            }, 1500);
        }

        function showAlert(msg, title, icon) {
            isPaused = true;
            playBeep('error');
            document.getElementById('alert-icon').innerText = icon;
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-text').innerText = msg;
            document.getElementById('alert-modal').style.display = 'flex';
        }

        function closeAlert() {
            document.getElementById('alert-modal').style.display = 'none';
            setTimeout(() => isPaused = false, 500);
        }

        function startCamera() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, onScanSuccess);
        }

        function playBeep(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = type === 'success' ? 'sine' : 'sawtooth';
            osc.frequency.value = type === 'success' ? 800 : 200;
            osc.connect(ctx.destination);
            osc.start();
            setTimeout(() => osc.stop(), 200);
        }
    </script>
</body>
</html>
