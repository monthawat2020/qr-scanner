<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารจัดการหลังบ้าน</title>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { text-align: center; padding: 20px; width: 90%; max-width: 400px; }
        .logo { font-size: 80px; margin-bottom: 10px; }
        h1 { color: #333; margin-bottom: 30px; }
        
        /* ปุ่มเมนู */
        .menu-btn { 
            display: flex; align-items: center; justify-content: center; gap: 15px;
            width: 100%; padding: 20px; margin-bottom: 15px;
            background: white; color: #333; text-decoration: none;
            border-radius: 15px; font-size: 18px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s;
        }
        .menu-btn:active { transform: scale(0.98); background: #eee; }
        .menu-btn i { font-size: 24px; }
        
        /* สไตล์ปุ่มเด่นๆ */
        .btn-order { border-left: 8px solid var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">📦</div>
        <h1>Main Menu</h1>
        
        <a href="orders.html" class="menu-btn btn-order">
            <span>📦 ระบบจัดการคำสั่งซื้อ</span>
        </a>

        </div>

</body>
</html>
